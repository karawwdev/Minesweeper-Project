<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Nav section for our personal info -->
  <nav>
    <ul>
      <li>Kara & Violet</li>
         <details>
        <summary>Github</summary>
        <div class="drop-down">
          <li><a href="https://github.com/karawwdev">Kara's Github</a></li>
          <li><a href="https://github.com/pocketofrain">Violet's GitHub</a></li>
        </div>
      </details>
      <details>
        <summary>LinkedIn</summary>
        <div class="drop-down">
          <li><a href="">Kara's LinkedIn</a></li>
          <li><a href="">Violet's LinkedIn</a></li>
        </div>
      </details>
    </ul>
  </nav>

  <!-- Main title -->
  <div class="title">
    <h1>Minesweeper</h1>
  </div>

  <!-- The board, cells get added here as child divs -->
  <div id="board"></div>

  <!-- Game buttons -->
  <section class="button">
    <div class="game-buttons">
      <div>
        <details class="difficulty-button">
          <summary>Difficulty</summary>
          <button>Easy</button>
          <button>Medium</button>
          <button>Hard</button>
        </details>
      </div>
      <button id="flag-button">🚩</button>
    </div>
  </section>
  
  <script src="script.js"></script>
</body>
</html>
